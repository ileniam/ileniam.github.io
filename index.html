<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Climate Impact Poster - References</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <style>
        <!-- test -->
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .poster-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.8s ease;
            opacity: 1;
        }

        .poster-section.fade-out {
            opacity: 0;
            transform: translateY(-50px);
        }

        .poster-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 30px;
            max-width: 90%;
            max-height: 90vh;
            overflow: hidden;
        }

        .poster-image {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .poster-image:hover {
            transform: scale(1.02);
        }

        .progress-bar-custom {
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            margin-top: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .references-section {
            background: #f8f9fa;
            min-height: 100vh;
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.8s ease;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: -1;
        }

        .references-section.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
            z-index: 1;
        }

        .header-section {
            background: linear-gradient(135deg, #527ac9 0%, #6b89d6 100%);
            color: white;
            padding: 60px 0 40px 0;
            position: relative;
            overflow: hidden;
        }

        .header-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" fill="white" opacity="0.1"><polygon points="0,0 1000,80 1000,100 0,100"/></svg>');
            background-size: cover;
        }

        .content-card {
            background: white;
            border-radius: 20px 20px 0 0;
            margin-top: -20px;
            position: relative;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            min-height: 60vh;
        }

        .reference-link {
            background: white;
            border-radius: 50px;
            padding: 15px 25px;
            margin-bottom: 15px;
            text-decoration: none;
            color: #7ec09f;
            font-weight: 500;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid transparent;
        }

        .reference-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            color: #5fa582;
            border-color: #7ec09f;
        }

        .reference-text {
            flex: 1;
            margin-right: 15px;
            line-height: 1.5;
        }

        .arrow-icon {
            color: #7ec09f;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .reference-link:hover .arrow-icon {
            transform: translateX(5px);
        }

        .social-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }

        .social-link {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            text-decoration: none;
            color: #131D29;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .social-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            color: #131D29;
        }

        .social-info {
            display: flex;
            align-items: center;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            margin-right: 20px;
            border-radius: 10px;
        }

        .social-details h6 {
            margin: 0;
            font-weight: 600;
            color: #131D29;
        }

        .social-details small {
            color: #767C83;
            font-size: 0.85rem;
        }

        .loading-text {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 1.1rem;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .countdown {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 25px;
            font-weight: 600;
            color: #527ac9;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .poster-container {
                padding: 20px;
                margin: 20px;
            }
            
            .header-section {
                padding: 40px 0 30px 0;
            }
            
            .reference-link {
                padding: 12px 20px;
                border-radius: 30px;
            }
            
            .reference-text {
                font-size: 0.9rem;
            }
            
            .social-link {
                padding: 15px;
            }
            
            .social-icon {
                width: 40px;
                height: 40px;
                margin-right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Poster Section -->
    <div class="poster-section" id="posterSection">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="poster-container" data-aos="zoom-in" data-aos-duration="1000">
                        <div class="countdown" id="countdown">3</div>
                        <img src="AI_ASSISTED_CLIMATE_DOWNSCALING_POSTER.png" 
                             alt="AI applications for climate impact analysis and territorial resilience" 
                             class="poster-image">
                        <div class="progress-bar-custom"></div>
                        <div class="loading-text">
                            <i class="bi bi-hourglass-split me-2"></i>
                            Caricamento riferimenti bibliografici...
                        </div>

                        <!-- Download button -->
                        <div class="text-center mt-3" data-aos="fade-up" data-aos-delay="200">
                            <a href="AI_ASSISTED_CLIMATE_DOWNSCALING_POSTER.png" 
                               target="_blank"
                                   download="AI_ASSISTED_CLIMATE_DOWNSCALING_POSTER.png"
                                       class="btn btn-success btn-lg shadow-sm">
                                        <i class="bi bi-download me-2"></i>Scarica il poster
                                    </a>
                                </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
